<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self';"
    />
    <title>Room Lab · 三主题大关编辑器 v3.1.0</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <button id="home" class="brand">ROOM LAB <small>三主题大关 / v3.1.0</small></button>
      <nav id="breadcrumbs"></nav>
      <div class="header-actions" id="editor-actions" hidden>
        <button id="save-project">保存项目</button><button id="open-cloud">☁ 工作树</button>
        <div class="menu" data-menu>
          <button
            class="menu-trigger"
            data-menu-trigger
            aria-expanded="false"
            aria-controls="menu-project"
          >
            项目 ▾
          </button>
          <div class="menu-panel" id="menu-project" data-menu-panel role="group" hidden>
            <button id="new-project">新建大关</button><button id="open-project">打开项目</button
            ><button id="save-as">另存为</button><button id="export-project">导出项目包</button
            ><button id="export-room" disabled>导出房间</button
            ><button id="import-room">导入房间</button
            ><button id="cloud-room-library">云端房间库</button>
          </div>
        </div>
        <div class="menu" data-menu>
          <button
            class="menu-trigger"
            data-menu-trigger
            aria-expanded="false"
            aria-controls="menu-tools"
          >
            工具 ▾
          </button>
          <div class="menu-panel" id="menu-tools" data-menu-panel role="group" hidden>
            <button id="open-assets">素材库</button><button id="open-definitions">功能块</button>
          </div>
        </div>
      </div>
      <input id="project-file" type="file" accept=".json,.zip" hidden />
    </header>
    <div id="status" role="status">正在加载…</div>
    <main id="app"></main>
    <dialog id="dialog">
      <h2 id="dialog-title"></h2>
      <div id="dialog-content"></div>
      <div id="dialog-actions"></div>
    </dialog>
    <input id="asset-files" type="file" accept="image/*" multiple hidden />
    <input id="room-package-file" type="file" accept=".zip" hidden />
    <script src="ui.js"></script>
  </body>
</html>
